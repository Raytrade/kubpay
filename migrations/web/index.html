<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>KubPay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #090b0f;
            color: #ffffff;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        main {
            width: min(700px, 100%);
            margin: auto;
            padding: 24px;
        }

        .card {
            background: #151922;
            border: 1px solid #292f3b;
            border-radius: 16px;
            padding: 20px;
            margin: 14px 0;
        }

        h1 {
            margin-bottom: 4px;
        }

        .muted {
            opacity: .65;
        }
    </style>
</head>

<body>

<main>

    <h1>KubPay</h1>

    <p class="muted">
        Ledger-first NGN financial application
    </p>

    <section class="card">
        <h2>Account</h2>

        <p>
            KubPay backend is running.
        </p>

        <p class="muted">
            Balances and transaction states are controlled by
            the backend ledger.
        </p>
    </section>

    <section class="card">
        <h2>Security</h2>

        <p>
            Provider secrets must remain server-side.
        </p>
    </section>

</main>

</body>
  </html>
