name: KubPay CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Download dependencies
        run: go mod tidy

      - name: Format
        run: gofmt -w cmd

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
